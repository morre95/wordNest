x-api-environment: &api-environment
  WORDNEST_ENVIRONMENT: development
  WORDNEST_TRANSLATION_PROVIDER: ${WORDNEST_TRANSLATION_PROVIDER:-fake}
  WORDNEST_ANTHROPIC_API_KEY: ${WORDNEST_ANTHROPIC_API_KEY:-}
  WORDNEST_LOG_LEVEL: ${WORDNEST_LOG_LEVEL:-INFO}
  WORDNEST_JWT_SECRET: ${WORDNEST_JWT_SECRET:-development-only-do-not-use-in-production}
  WORDNEST_DATABASE_URL: >-
    postgresql+asyncpg://wordnest:${POSTGRES_PASSWORD:-wordnest-dev}@db:5432/wordnest

services:
  # Migrations run as their own step and exit. Never on API startup: several
  # API containers starting together would migrate concurrently, which is the
  # one thing a migration must never do.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wordnest
      POSTGRES_USER: wordnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordnest-dev}
    ports:
      # Published for a psql client on the host, not for the API — that talks
      # over the compose network. 5433 by default because a developer machine
      # very often already has Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Mounted at /var/lib/postgresql, not .../data: that is what the
      # postgres:18 image expects, and it is what makes a later `pg_upgrade
      # --link` possible without a mount-point boundary in the way.
      - wordnest-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordnest -d wordnest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wordnest-db:
