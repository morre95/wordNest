services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      WORDNEST_ENVIRONMENT: development
      WORDNEST_TRANSLATION_PROVIDER: ${WORDNEST_TRANSLATION_PROVIDER:-fake}
      WORDNEST_ANTHROPIC_API_KEY: ${WORDNEST_ANTHROPIC_API_KEY:-}
      WORDNEST_LOG_LEVEL: ${WORDNEST_LOG_LEVEL:-INFO}
      # Postgres arrives with sync in milestone 4.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wordnest
      POSTGRES_USER: wordnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordnest-dev}
    ports:
      - "5432:5432"
    volumes:
      - wordnest-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordnest -d wordnest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wordnest-db:
