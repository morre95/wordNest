[project]
name = "wordnest-api"
version = "0.1.0"
description = "WordNest backend: translation with linguistic breakdown, and the authoritative store for cross-device sync."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "uvicorn[standard]>=0.41.0",
    "anthropic>=0.75.0",
    "jinja2>=3.1.6",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.17.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.0",
    "pyjwt>=2.11.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordnest_api"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = ["S101"]  # pytest uses bare asserts

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
