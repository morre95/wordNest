name: wordnest
description: "WordNest — voice-first translation and glossary"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # State, navigation, models
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Speech / translation / pronunciation
  speech_to_text: ^7.4.0
  google_mlkit_translation: ^0.15.1
  flutter_tts: ^4.2.5

  # Storage
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Platform + networking
  dio: ^5.11.0
  permission_handler: ^13.0.1
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
